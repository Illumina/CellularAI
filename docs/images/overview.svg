<text class="txt" x="265" y="223" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Plan responses</text>
<text class="mut" x="237" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Responding genes,</text>
<text class="mut" x="237" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">directions, sizes</text>
<path class="arw" d="M379,244 L399,244" stroke="#8c959f" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<rect class="stg" x="402" y="192" width="156" height="104" rx="10" fill="#eef4ff" stroke="#9cb8f0" stroke-width="1.2"/>
<circle class="badge" cx="426" cy="218" r="12" fill="#2f6fdf"/>
<text class="" x="426" y="222.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text class="txt" x="446" y="223" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Residual model</text>
<text class="mut" x="418" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Low-rank ridge/SVD</text>
<text class="mut" x="418" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">from control cells</text>
<path class="arw" d="M560,244 L580,244" stroke="#8c959f" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<rect class="stg" x="583" y="192" width="156" height="104" rx="10" fill="#eef4ff" stroke="#9cb8f0" stroke-width="1.2"/>
<circle class="badge" cx="607" cy="218" r="12" fill="#2f6fdf"/>
<text class="" x="607" y="222.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text class="txt" x="627" y="223" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Design counts</text>
<text class="mut" x="599" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Integer per-gene</text>
<text class="mut" x="599" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">totals per target</text>
<path class="arw" d="M741,244 L761,244" stroke="#8c959f" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<rect class="stg" x="764" y="192" width="156" height="104" rx="10" fill="#eef4ff" stroke="#9cb8f0" stroke-width="1.2"/>
<circle class="badge" cx="788" cy="218" r="12" fill="#2f6fdf"/>
<text class="" x="788" y="222.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text class="txt" x="808" y="223" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Generate cells</text>
<text class="mut" x="780" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">N cells per target</text>
<text class="mut" x="780" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">(default 400)</text>
<path class="arw" d="M360,316 L360,344" stroke="#8c959f" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<rect class="gate" x="20" y="346" width="680" height="80" rx="10" fill="#edf8f0" stroke="#7cc394" stroke-width="1.2"/>
<text class="gtl" x="40" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1a7f37" text-anchor="start">✓  Quality gates</text>
<text class="mut" x="40" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Gene/target axes · 400-cell blocks · integer counts · call depth · convergence</text>
<text class="mut" x="40" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Readout coverage · provenance fingerprints · numerical guards — any failure stops the merge</text>
