<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" width="960" height="448" role="img" aria-labelledby="t d">
<title id="t">CellularAI pipeline overview</title>
<desc id="d">A training summary bundle and a prediction task feed a per-context pipeline: pool effects, plan responses, residual model, design counts, generate cells. Quality gates then check each build before outputs are merged into prediction.h5ad.</desc>
<style>
@media (prefers-color-scheme: dark) {
  .bg{fill:#0d1117} .txt{fill:#e6edf3} .mut{fill:#9198a1}
  .inp{fill:#161b22;stroke:#3d444d} .panel{stroke:#3d444d} .plab{fill:#9198a1}
  .stg{fill:#121d33;stroke:#3a63b0} .badge{fill:#4f8ff7} .arw{stroke:#768390} .head{fill:#768390}
  .gate{fill:#0f2418;stroke:#2f7d45} .gtl{fill:#56d364}
  .out{fill:#2b1d0a;stroke:#b8741a} .otl{fill:#f0b45a}
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect class="bg" x="0" y="0" width="960" height="448" rx="14" fill="#ffffff"/>
<rect class="inp" x="150" y="22" width="300" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text class="txt" x="300" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Training summary bundle</text>
<text class="mut" x="300" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">Billion Cell Atlas effect &amp; significance summaries</text>
<rect class="inp" x="510" y="22" width="300" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text class="txt" x="660" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Prediction task</text>
<text class="mut" x="660" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">Readout genes · perturbations · context controls</text>
<path class="arw" d="M300,92 L300,116" stroke="#8c959f" stroke-width="1.8" fill="none"/>
<path class="arw" d="M660,92 L660,116" stroke="#8c959f" stroke-width="1.8" fill="none"/>
<path class="arw" d="M300,116 L660,116" stroke="#8c959f" stroke-width="1.8" fill="none"/>
<path class="arw" d="M480,116 L480,148" stroke="#8c959f" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<rect class="panel" x="20" y="150" width="920" height="166" rx="12" fill="none" stroke="#c8d1dc" stroke-width="1.2" stroke-dasharray="5 4"/>
<text class="plab" x="40" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6e7781" text-anchor="start">FOR EACH CONTEXT</text>
<rect class="stg" x="40" y="192" width="156" height="104" rx="10" fill="#eef4ff" stroke="#9cb8f0" stroke-width="1.2"/>
